name: Phase 4 runtime RED observe

on:
  push:
    branches: [agent/completion-single-owner-phase4]
    paths:
      - .github/workflows/phase4-runtime-red-observe.yml
      - tests/completion-runtime-phase4.test.js
      - src/core/root-runtime.js
      - src/governance/completion-evaluator.js

permissions:
  contents: read

jobs:
  observe-runtime-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run focused runtime completion tests
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test tests/completion-runtime-phase4.test.js 2>&1 | tee phase4-runtime-red.log
      - name: Upload focused RED evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase4-runtime-red-evidence
          path: phase4-runtime-red.log
          if-no-files-found: error
      - name: Preserve RED status
        if: steps.focused.outcome == 'failure'
        run: exit 1
