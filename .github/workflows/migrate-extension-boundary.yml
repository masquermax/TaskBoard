name: Migrate extension boundary

on:
  push:
    branches: [v0.9.2]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove concrete extensions from TaskBoard
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src/extensions/builtins src/extensions/capabilities src/extensions/config src/extensions/executors src/extensions/surfaces
          rm -f src/server/mock.js docs/CODEX_INTEGRATION.md TaskBoard-in-Codex.vbs scripts/windows-codex-desktop.mjs scripts/windows-surface-launcher.mjs

          mkdir -p tests/fixtures
          cat > tests/fixtures/test-executor.js <<'EOF'
          function wait(ms,signal){return new Promise((resolve,reject)=>{if(signal?.aborted){const e=new Error('Execution interrupted');e.interrupted=true;return reject(e);}const timer=setTimeout(resolve,ms);signal?.addEventListener?.('abort',()=>{clearTimeout(timer);const e=new Error('Execution interrupted');e.interrupted=true;reject(e);},{once:true});});}
          function value(schema={}){if(Array.isArray(schema?.enum)&&schema.enum.length)return schema.enum[0];if(Array.isArray(schema?.type)){if(schema.type.includes('null'))return null;return value({...schema,type:schema.type[0]});}if(schema?.anyOf){const nullable=schema.anyOf.find(item=>item?.type==='null');if(nullable)return null;return value(schema.anyOf[0]||{});}if(schema?.type==='array')return[];if(schema?.type==='boolean')return false;if(schema?.type==='number'||schema?.type==='integer')return 0;if(schema?.type==='object'||schema?.properties){const out={};for(const key of schema.required||[])out[key]=value(schema.properties?.[key]||{});return out;}return '';}
          export class TestExecutor {
            async health(){return{executor:'test',available:true,version:'test',error:null};}
            async execute(request={}){request.onExecutionStarted?.({test:true});await wait(1,request.signal);return value(request.responseContract||{});}
          }
          EOF

          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, writeFileSync, unlinkSync } from 'node:fs';
          for (const name of readdirSync('tests').filter(x=>x.endsWith('.test.js'))) {
            const file=`tests/${name}`;
            let source=readFileSync(file,'utf8');
            source=source
              .replaceAll("import { MockExecutor } from '../src/extensions/executors/mock/mock-executor.js';", "import { TestExecutor as MockExecutor } from './fixtures/test-executor.js';")
              .replaceAll("import { MockExecutor } from \"../src/extensions/executors/mock/mock-executor.js\";", "import { TestExecutor as MockExecutor } from './fixtures/test-executor.js';");
            if (/src\/extensions\/(?:builtins|capabilities|config|executors|surfaces)\//.test(source)) {
              unlinkSync(file);
              continue;
            }
            writeFileSync(file,source,'utf8');
          }

          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          pkg.description='Local-first governed AI task board with externally owned pluggable Extensions.';
          pkg.scripts.dev='node --watch src/server/index.js';
          delete pkg.scripts['start:mock'];
          delete pkg.scripts['test:connection-acceptance'];
          delete pkg.scripts['verify:connection'];
          writeFileSync('package.json',`${JSON.stringify(pkg,null,2)}\n`,'utf8');
          NODE

          cat > src/extensions/runtime/external-extension-loader.js <<'EOF'
          import { createRequire } from 'node:module';
          import { isAbsolute, resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { EXTENSION_API_VERSION } from './extension-registry.js';

          const require = createRequire(import.meta.url);
          function normalizeSpecs(value){if(Array.isArray(value))return value.map(item=>String(item||'').trim()).filter(Boolean);return String(value||'').split(';').map(item=>item.trim()).filter(Boolean);}
          function moduleTarget(spec,rootDir){const value=String(spec||'').trim();if(!value)return'';const windowsAbsolute=/^[A-Za-z]:[\\/]/.test(value);if(isAbsolute(value)||windowsAbsolute||value.startsWith('.'))return resolve(rootDir||process.cwd(),value);return value;}
          function descriptorFrom(moduleValue){const preferred=moduleValue?.default;if(preferred&&(preferred.id||preferred.createExtension||preferred.factory||preferred.register))return preferred;return moduleValue;}
          function wrappedLoadError(spec,error){const wrapped=new Error(`EXTERNAL_EXTENSION_LOAD_FAILED:${spec}`);wrapped.cause=error;return wrapped;}
          function loadDescriptorSync(spec,rootDir){const target=moduleTarget(spec,rootDir);try{return descriptorFrom(require(target));}catch(error){throw wrappedLoadError(spec,error);}}
          async function loadDescriptorAsync(spec,rootDir){const target=moduleTarget(spec,rootDir);try{const local=isAbsolute(target)||/^[A-Za-z]:[\\/]/.test(target);const loaded=local?await import(pathToFileURL(target).href):await import(target);return descriptorFrom(loaded);}catch(importError){try{return descriptorFrom(require(target));}catch(requireError){throw wrappedLoadError(spec,requireError?.code==='ERR_REQUIRE_ESM'?importError:requireError);}}}
          function descriptorFactory(descriptor,spec){const id=String(descriptor?.id||'').trim();const factory=descriptor?.createExtension||descriptor?.factory;if(!id)throw new Error(`EXTERNAL_EXTENSION_ID_REQUIRED:${spec}`);if(typeof factory!=='function')throw new Error(`EXTERNAL_EXTENSION_FACTORY_REQUIRED:${id}`);return{id,factory};}
          export function configuredExternalExtensionSpecs(value=process.env.TASKBOARD_EXTERNAL_EXTENSIONS){return normalizeSpecs(value);}
          export function registerExternalExtensions(registry,{rootDir=process.cwd(),specs=configuredExternalExtensionSpecs()}={}){const normalized=normalizeSpecs(specs);if(!normalized.length)return registry;if(!registry?.register)throw new Error('EXTENSION_REGISTRY_REQUIRED');for(const spec of normalized){const descriptor=loadDescriptorSync(spec,rootDir);if(typeof descriptor?.register==='function'){descriptor.register(registry);continue;}const{id,factory}=descriptorFactory(descriptor,spec);registry.register(id,factory);}return registry;}
          export function loadRegisteredExtensions(registry,{rootDir=process.cwd(),entries=[]}={}){const loadedIds=[],loadErrors={};if(!registry?.register)throw new Error('EXTENSION_REGISTRY_REQUIRED');for(const entry of Array.isArray(entries)?entries:[]){const expectedId=String(entry?.id||'').trim(),spec=String(entry?.entryPath||'').trim();if(!expectedId||!spec)continue;const persistedApiVersion=Number(entry?.apiVersion);if(Number.isInteger(persistedApiVersion)&&persistedApiVersion!==EXTENSION_API_VERSION){loadErrors[expectedId]=`EXTENSION_API_VERSION_UNSUPPORTED:${expectedId}:${persistedApiVersion}`;continue;}try{const descriptor=loadDescriptorSync(spec,rootDir);if(typeof descriptor?.register==='function')throw new Error(`EXTENSION_IMPORTED_REGISTRAR_UNSUPPORTED:${expectedId}`);const{id,factory}=descriptorFactory(descriptor,spec);if(id!==expectedId)throw new Error(`EXTENSION_REGISTERED_ID_MISMATCH:${expectedId}:${id}`);registry.register(id,factory);loadedIds.push(id);}catch(error){loadErrors[expectedId]=error?.message||String(error);}}return{loadedIds,loadErrors};}
          export async function loadRegisteredExtensionsAsync(registry,{rootDir=process.cwd(),entries=[]}={}){const loadedIds=[],loadErrors={};if(!registry?.register)throw new Error('EXTENSION_REGISTRY_REQUIRED');for(const entry of Array.isArray(entries)?entries:[]){const expectedId=String(entry?.id||'').trim(),spec=String(entry?.entryPath||'').trim();if(!expectedId||!spec)continue;const persistedApiVersion=Number(entry?.apiVersion);if(Number.isInteger(persistedApiVersion)&&persistedApiVersion!==EXTENSION_API_VERSION){loadErrors[expectedId]=`EXTENSION_API_VERSION_UNSUPPORTED:${expectedId}:${persistedApiVersion}`;continue;}try{const descriptor=await loadDescriptorAsync(spec,rootDir);if(typeof descriptor?.register==='function')throw new Error(`EXTENSION_IMPORTED_REGISTRAR_UNSUPPORTED:${expectedId}`);const{id,factory}=descriptorFactory(descriptor,spec);if(id!==expectedId)throw new Error(`EXTENSION_REGISTERED_ID_MISMATCH:${expectedId}:${id}`);registry.register(id,factory);loadedIds.push(id);}catch(error){loadErrors[expectedId]=error?.message||String(error);}}return{loadedIds,loadErrors};}
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/server/index.js')
          s=p.read_text()
          s=s.replace("import { loadRegisteredExtensions } from '../extensions/runtime/external-extension-loader.js';", "import { loadRegisteredExtensionsAsync } from '../extensions/runtime/external-extension-loader.js';")
          s=s.replace('const extensionLoadState = loadRegisteredExtensions(extensionRegistry, {', 'const extensionLoadState = await loadRegisteredExtensionsAsync(extensionRegistry, {')
          p.write_text(s)
          PY

          cat > README.md <<'EOF'
          # TaskBoard v0.9.2

          TaskBoard is a local-first governed AI Task runtime. It owns durable Task facts, Root/Subagent orchestration, deterministic validation, Completion evaluation, Scheduler lifecycle and the generic Extension Host.

          **TaskBoard contains no concrete Extension implementation.** All first-party, test/demo and third-party concrete Extensions are owned and versioned in [`masquermax/TaskBoard-Ecosystem`](https://github.com/masquermax/TaskBoard-Ecosystem). A stock TaskBoard process may therefore start in management mode until an Executor Extension is explicitly imported and selected.

          ## Run

          Prerequisite: Node.js 16.6+.

          1. Start `TaskBoard.vbs` or run `npm start`.
          2. Open `http://127.0.0.1:4317`.
          3. In Extension management, import an API-compatible Executor directory from TaskBoard-Ecosystem and select it.
          4. Restart when the UI requests it, then create Tasks.

          ## Extension boundary

          TaskBoard owns only generic Extension contracts, public author API, registry/loading/persistence, generic connection presentation and Surface management. Provider/API/model/transport/desktop integration and every other concrete implementation stay in TaskBoard-Ecosystem. See `docs/EXTENSIONS.md`.

          ## Development

          ```bash
          npm install
          npm run verify
          npm start
          ```

          ## Canonical documents

          - `docs/PRODUCT_CONSTITUTION.md` — first principles and non-negotiable repository boundary.
          - `docs/CAPABILITY_MAP.md` — semantic owners and enforcement map.
          - `docs/CAPABILITY_CONTRACTS.md` — role/capability projections.
          - `docs/SPECIFICATION.md` — current product semantics.
          - `docs/ARCHITECTURE.md` — architecture/runtime model.
          - `docs/EXTENSIONS.md` — generic Extension Host contract and Ecosystem ownership rule.
          - `docs/ADR.md` — durable design rationale.
          - `docs/VERIFICATION.md` — exact-tree verification status.
          EOF

          cat >> docs/PRODUCT_CONSTITUTION.md <<'EOF'

          ## C-006 — Core Repository Never Owns Concrete Extensions
          `masquermax/TaskBoard` 永远只拥有通用 Extension Contract / Public API / Host / Loader / Registry / Persistence / generic management surfaces；任何可被命名、替换、移除的具体 Extension 实现（包括第一方、测试/演示、Codex、Provider、Executor、Surface、Continuation、Automation 以及未来扩展类型）都必须由 `masquermax/TaskBoard-Ecosystem` 独立拥有和版本化。不得以“默认内置、发布方便、测试方便、临时兼容、启动兜底”等理由把具体 Extension 复制、vendor、生成或重新提交到任何 TaskBoard 分支。需要默认体验时，通过安装/导入/分发组合解决，不通过污染 Core Repository 解决。
          EOF

          cat >> docs/EXTENSIONS.md <<'EOF'

          ## Repository ownership — non-negotiable

          `masquermax/TaskBoard` owns the generic Extension Host only. Every concrete Extension implementation, including first-party defaults and test/demo Extensions, lives in `masquermax/TaskBoard-Ecosystem` and is versioned there. No TaskBoard branch may contain, vendor, generate or reintroduce a concrete Extension implementation. Release convenience and default-product composition do not create an exception; composition happens through explicit Extension import/binding.
          EOF

          cat > tests/extension-repository-boundary.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { existsSync, readdirSync, readFileSync, statSync } from 'node:fs';
          import { join, resolve } from 'node:path';

          function files(root){const out=[];if(!existsSync(root))return out;for(const name of readdirSync(root)){const p=join(root,name);if(statSync(p).isDirectory())out.push(...files(p));else out.push(p);}return out;}

          test('TaskBoard repository owns only generic Extension Host surfaces',()=>{
            const root=resolve('src/extensions');
            assert.deepEqual(readdirSync(root).sort(),['index.js','ports','public-api.js','runtime']);
            for(const removed of ['builtins','capabilities','config','executors','surfaces']) assert.equal(existsSync(join(root,removed)),false,`${removed} belongs in TaskBoard-Ecosystem`);
            for(const removed of ['TaskBoard-in-Codex.vbs','docs/CODEX_INTEGRATION.md','scripts/windows-codex-desktop.mjs','scripts/windows-surface-launcher.mjs']) assert.equal(existsSync(resolve(removed)),false,`${removed} is concrete-extension material`);
          });

          test('product source contains no known concrete Extension implementation',()=>{
            const source=files(resolve('src')).filter(p=>/\.(?:js|mjs|cjs)$/.test(p)).map(p=>readFileSync(p,'utf8')).join('\n');
            assert.doesNotMatch(source,/createCodexExtension|class\s+CodexExecutor|class\s+MockExecutor|OpenAI\.Codex|TASKBOARD_CODEX_/);
          });

          test('durable product rules route every concrete Extension to Ecosystem',()=>{
            const constitution=readFileSync(resolve('docs/PRODUCT_CONSTITUTION.md'),'utf8');
            const contract=readFileSync(resolve('docs/EXTENSIONS.md'),'utf8');
            assert.match(constitution,/Core Repository Never Owns Concrete Extensions/);
            assert.match(constitution,/TaskBoard-Ecosystem/);
            assert.match(contract,/Repository ownership — non-negotiable/);
            assert.match(contract,/No TaskBoard branch may contain/);
          });
          EOF

          # Extension-specific tests belong with their implementation. Core tests that
          # used Mock only as a test double were rewritten above to the generic fixture.
          for f in tests/*.test.js; do
            if grep -Eq 'Codex|CODEX_|provider-profile|Provider acceptance|cdp-|CDP|OpenAI\.Codex|TASKBOARD_CODEX_' "$f"; then
              if grep -Eq "src/extensions/|windows-codex|windows-surface|provider-acceptance|codex-" "$f"; then rm -f "$f"; fi
            fi
          done

          # No concrete brand/runtime implementation may remain in product source.
          if grep -RInE 'createCodexExtension|class[[:space:]]+CodexExecutor|class[[:space:]]+MockExecutor|OpenAI\.Codex|TASKBOARD_CODEX_' src --include='*.js' --include='*.mjs' --include='*.cjs'; then
            echo 'Concrete Extension implementation remains in TaskBoard source.' >&2
            exit 1
          fi

      - name: Verify TaskBoard host
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run verify

      - name: Commit host-only boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "masquermax"
          git config user.email "224842982+masquermax@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: keep concrete extensions outside TaskBoard"
          git push origin HEAD:v0.9.2
