name: Apply Root-first lifecycle refactor

on:
  push:
    branches: [v0.9.2]
    paths:
      - .github/workflows/apply-root-first-lifecycle.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply minimum lifecycle refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          fidelity=Path('src/governance/task-contract-fidelity.js')
          text=fidelity.read_text()
          pattern=r"export function defaultAuthoritySemanticCandidates\(task=\{\}\)\{.*?\}\nexport function resolveRequirementRefs"
          replacement="""export function authoritySemanticCandidatesForWork(task={},workUnits=[]){const contract=governedTaskContract(task);if(!contract)return[];const requirementRefs=governedRequirementRefs(contract);if(!requirementRefs.length)return[];const authority=contract.authority&&typeof contract.authority==='object'?contract.authority:{};const revision=Math.max(1,Number(contract.revision)||1),contractId=text(contract.id)||text(task?.id)||'task',units=Array.isArray(workUnits)?workUnits:[],out=[];const needsProjectWrite=units.some(unit=>text(unit?.projectAccess).toLowerCase()==='write');const needsNetwork=units.some(unit=>unit?.networkAccess===true);if(needsProjectWrite&&!Object.prototype.hasOwnProperty.call(authority,'projectWrite'))out.push(createAuthoritySemanticCandidate({id:`AUTH:${contractId}:r${revision}:projectWrite`,key:'projectWrite',value:true,requirementRefs}));if(needsNetwork&&!Object.prototype.hasOwnProperty.call(authority,'networkAccess'))out.push(createAuthoritySemanticCandidate({id:`AUTH:${contractId}:r${revision}:networkAccess`,key:'networkAccess',value:true,requirementRefs}));return out;}
          export function resolveRequirementRefs"""
          text2,count=re.subn(pattern,replacement,text,count=1,flags=re.S)
          assert count==1, f'authority candidate replacement count={count}'
          fidelity.write_text(text2)

          root=Path('src/core/root-runtime.js')
          text=root.read_text()
          old="import { applyAuthorityFidelity, defaultAuthoritySemanticCandidates } from '../governance/task-contract-fidelity.js';"
          new="import { applyAuthorityFidelity, authoritySemanticCandidatesForWork } from '../governance/task-contract-fidelity.js';"
          assert text.count(old)==1
          text=text.replace(old,new,1)

          method_pattern=r"  async ensureTaskAuthority\(task,session,callbacks\)\{.*?\}\n\n  createSession"
          method_replacement="""  async certifyWorkAuthority(task,session,callbacks,workUnits=[]){const candidates=authoritySemanticCandidatesForWork(task,workUnits);if(!candidates.length)return task;session.actor={title:'Requirement Authority 认证',status:WorkUnitStatus.WAITING_RESOURCE,detail:'Root 已提出受治理 Work capability；等待 Validator 核对这一具体语义晋升。',updatedAt:nowIso(),owner:'validator'};this.emit(session,callbacks);let reviews=[];if(this.taskContractFidelityVerifier){const result=await this.taskContractFidelityVerifier.review({task,candidates,policyContext:this.governanceCompiler?.compileForRole?.(task,'validator')||session.policyContext,onExecutionStarted:()=>{session.actor.status=WorkUnitStatus.RUNNING;callbacks.onExecutionStarted?.({role:'validator'});this.emit(session,callbacks);},onProgress:p=>{session.actor.detail=p?.detail||p?.summary||session.actor.detail;this.emit(session,callbacks);}});reviews=Array.isArray(result?.reviews)?result.reviews:[];}const nextContract=applyAuthorityFidelity(task.taskContract,candidates,reviews);callbacks.onTaskContractAuthority?.(nextContract.authority);const next={...task,taskContract:nextContract};session.policyContext=this.governanceCompiler?.compileForTask?.(next)||session.policyContext;return next;}

  createSession"""
          text2,count=re.subn(method_pattern,method_replacement,text,count=1,flags=re.S)
          assert count==1, f'authority method replacement count={count}'
          text=text2

          startup="    try{task=await this.ensureTaskAuthority(task,session,callbacks);}catch(error){if(isCapacityUnavailable(error)){const delay=capacityRetryDelayMs(this.retryDelaysMs);return{kind:'waiting_resource',retryAt:Date.now()+delay,snapshot:this.makeSnapshot(session),reason:'等待 Requirement Authority Validator 资源恢复'};}throw error;}\n"
          assert text.count(startup)==1
          text=text.replace(startup,'',1)

          marker="""        const plan=validateDelegationPlan(decision.delegations,{knownWorkIds,availableInputRefs:taskInputRefs(task)});
        if(plan.valid){
          if(this.governanceCompiler?.compileForRole){"""
          insert="""        const plan=validateDelegationPlan(decision.delegations,{knownWorkIds,availableInputRefs:taskInputRefs(task)});
        if(plan.valid){
          try{task=await this.certifyWorkAuthority(task,session,callbacks,plan.delegations);}
          catch(error){if(isCapacityUnavailable(error)){const outcome=await capacityWait({title:'Requirement Authority 认证',detail:'Root 已明确提出受治理 Work capability；等待 Validator 核对这一具体语义晋升。',reason:'等待 Requirement Authority Validator 资源恢复'});if(outcome)return outcome;continue;}throw error;}
          if(this.governanceCompiler?.compileForRole){"""
          assert text.count(marker)==1
          text=text.replace(marker,insert,1)
          root.write_text(text)
          PY

          cat > tests/authority-persistence-phase3.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { mkdtempSync, rmSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          import { tmpdir } from 'node:os';
          import { authoritySemanticCandidatesForWork } from '../src/governance/task-contract-fidelity.js';
          import { JsonTaskDatabase, JsonTaskRepository } from '../src/core/json-repository.js';
          import { RootRuntime } from '../src/core/root-runtime.js';
          import { GovernanceCompiler } from '../src/governance/governance-compiler.js';

          const rootDir=resolve('.');

          test('Authority candidates are derived only from concrete Work capability needs',()=>{
            const ref={source_id:'REQ-INITIAL',start:0,end:12};
            const task={id:'T-A',taskContract:{id:'TC-T-A',revision:1,requirementRefs:[ref],authority:{networkAccess:{value:true,certification:'unresolved',requirement_refs:[ref]}}}};
            assert.deepEqual(authoritySemanticCandidatesForWork(task,[{projectAccess:'read',networkAccess:false}]),[],'read/no-network work does not manufacture stronger Authority');
            const candidates=authoritySemanticCandidatesForWork(task,[{projectAccess:'write',networkAccess:false}]);
            assert.deepEqual(candidates.map(item=>item.key),['projectWrite']);
            assert.deepEqual(candidates[0].requirementRefs,[{sourceId:'REQ-INITIAL',start:0,end:12}]);
          });

          test('Task Core authority commit is additive, idempotent, and rejects semantic rewrite under the same key',()=>{
            const dir=mkdtempSync(join(tmpdir(),'taskboard-authority-persist-'));
            const db=new JsonTaskDatabase(join(dir,'db.json'));const repo=new JsonTaskRepository(db);
            try{
              const task=repo.createTask({title:'authority',instruction:'请修改项目代码'});
              const item={value:true,certification:'supported',requirement_refs:[{source_id:'REQ-INITIAL',start:0,end:8}]};
              repo.commitTaskContractAuthority(task.id,{projectWrite:item});
              repo.commitTaskContractAuthority(task.id,{projectWrite:item});
              assert.deepEqual(repo.getTask(task.id).taskContract.authority.projectWrite,item);
              assert.throws(()=>repo.commitTaskContractAuthority(task.id,{projectWrite:{...item,certification:'unresolved'}}),/TASK_CONTRACT_AUTHORITY_CONFLICT:projectWrite/);
            }finally{db.close();rmSync(dir,{recursive:true,force:true});}
          });

          test('a concrete Work Authority semantic is certified once and persisted across Runtime sessions',async()=>{
            const instruction='请修改项目代码';
            const ref={source_id:'REQ-INITIAL',start:0,end:instruction.length};
            const base={id:'T-ONCE',title:'authority',instruction,projectScopes:[{path:'/project'}],attachments:[],references:[],requirementSources:[{id:'REQ-INITIAL',kind:'user_initial',text:instruction}],taskContract:{id:'TC-T-ONCE',revision:1,requirementRefs:[ref],authority:{},obligations:[],constraints:[]}};
            const work=[{projectAccess:'write',networkAccess:false}];
            let calls=0;
            const verifier={async review({candidates}){calls+=1;return{checked:true,reviews:candidates.map(item=>({...item,certification:'supported',reason:'explicit'}))};}};
            const runtime=new RootRuntime({executor:{},modelRouter:{release(){}},subagentRuntime:{},governanceCompiler:new GovernanceCompiler({rootDir}),taskContractFidelityVerifier:verifier});
            let persisted=null;
            const session=runtime.createSession(base);
            const certified=await runtime.certifyWorkAuthority(base,session,{onTaskContractAuthority:value=>{persisted=value;},onProgress(){},onExecutionStarted(){}},work);
            assert.equal(calls,1);assert.equal(certified.taskContract.authority.projectWrite.certification,'supported');
            runtime.discardSession(base.id);
            const restored={...base,taskContract:{...base.taskContract,authority:persisted}};
            const restoredSession=runtime.createSession(restored);
            await runtime.certifyWorkAuthority(restored,restoredSession,{onTaskContractAuthority(){throw new Error('must not persist twice');},onProgress(){},onExecutionStarted(){}},work);
            assert.equal(calls,1,'persisted Authority facts suppress re-certification of the same semantic need');
          });
          EOF

          rm .github/workflows/apply-root-first-lifecycle.yml
          npm run verify
      - name: Commit verified refactor
        shell: bash
        run: |
          git config user.name "TaskBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/core/root-runtime.js src/governance/task-contract-fidelity.js tests/authority-persistence-phase3.test.js .github/workflows/apply-root-first-lifecycle.yml
          git commit -m "fix: certify authority only for concrete Work needs"
          git push origin HEAD:v0.9.2
