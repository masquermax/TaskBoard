name: Goal authority patch

on:
  push:
    branches:
      - agent/main-authority-root-cause
    paths:
      - scripts/goal-authority-patch-7.mjs
      - scripts/run-goal-authority-patch-7.mjs
      - scripts/goal-authority-patch-8.mjs
      - .github/workflows/goal-authority-patch.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/main-authority-root-cause
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/run-goal-authority-patch-7.mjs
      - run: node scripts/goal-authority-patch-8.mjs
      - name: Remove cloud patch scaffolding before product verification
        run: rm -f scripts/goal-authority-patch*.mjs scripts/run-goal-authority-patch-*.mjs
      - run: git diff --check
      - run: npm run verify
      - name: Commit verified source and regression changes
        run: |
          if git diff --quiet -- src tests; then
            echo "No verified source/test changes to commit"
            exit 0
          fi
          git config user.name "taskboard-goal-bot"
          git config user.email "taskboard-goal-bot@users.noreply.github.com"
          git add src tests
          git commit -m "fix: close side-effect and ambient capability bypasses"
          git push origin HEAD:agent/main-authority-root-cause
