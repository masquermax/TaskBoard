name: Phase 4 UI projection acceptance

on:
  push:
    branches: [agent/completion-single-owner-phase4]
    paths:
      - scripts/phase4-fixture-migration.mjs
      - scripts/phase4-ui-projection.mjs
      - tests/codex-full-flow.test.js
      - tests/completion-ui-projection-phase4.test.js
      - src/ui/app.js
      - src/ui/app.css
      - .github/workflows/phase4-fixture-migration.yml

permissions:
  contents: write

jobs:
  ui-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/completion-single-owner-phase4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/phase4-fixture-migration.mjs
      - run: node scripts/phase4-ui-projection.mjs
      - run: git diff --check
      - name: Verify migrated fixtures and UI completion projection
        run: >-
          node --test
          tests/cleanup-controller.test.js
          tests/code-audit-regressions.test.js
          tests/codex-full-flow.test.js
          tests/completion-ui-projection-phase4.test.js
          tests/evidence-boundary.test.js
          tests/full-flow.test.js
          tests/goal-debug-regressions.test.js
          tests/governance-analysis.test.js
          tests/lifecycle-actions.test.js
          tests/queue-runtime.test.js
          tests/runtime-authority-boundary.test.js
          tests/runtime-regressions.test.js
          tests/scheduler.test.js
          tests/task-service.test.js
          tests/turn-learning.test.js
          tests/validator-resource-resume.test.js
          tests/ui-contract.test.js
      - name: Observe full suite
        shell: bash
        run: |
          set +e
          npm run verify > "$RUNNER_TEMP/phase4-full-suite.log" 2>&1
          status=$?
          echo "FULL_SUITE_EXIT=$status"
          grep -E '^not ok |^# (tests|pass|fail|cancelled|skipped|todo) ' "$RUNNER_TEMP/phase4-full-suite.log" || true
          exit 0
      - name: Commit verified UI projection
        run: |
          git config user.name "taskboard-phase4-bot"
          git config user.email "taskboard-phase4-bot@users.noreply.github.com"
          git add src/ui/app.js src/ui/app.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: project completion lifecycle reason in UI"
          git push origin HEAD:agent/completion-single-owner-phase4
