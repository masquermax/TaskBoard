name: Apply Root progress patch

on:
  push:
    branches: [agent/root-goal-contribution-witness]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply asserted patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          root='src/core/root-runtime.js'
          codex='src/extensions/executors/codex/codex-executor.js'

          replace_once(root,
          "import { capabilitiesSatisfy, requiredWorkCapabilities, workMayMutate } from './work-capability.js';",
          "import { capabilitiesSatisfy, requiredWorkCapabilities, workMayMutate } from './work-capability.js';\nimport { availableContributionRefsForTask, hasLocalProgressSignal, repeatedContributionRefs, validateContributionRefs } from './work-contribution.js';",
          'root import')

          replace_once(root,
          "    title: unit.title,\n    projectAccess: unit.projectAccess || 'none',",
          "    title: unit.title,\n    contributionRefs:[...(unit.contributionRefs||[])],\n    projectAccess: unit.projectAccess || 'none',",
          'snapshot contribution refs')

          replace_once(root,
          "    skillId:normalize(item?.skillId),\n    dependsOn:[...(Array.isArray(item?.dependsOn)?item.dependsOn:[])].map(normalize).filter(Boolean).sort(),",
          "    skillId:normalize(item?.skillId),\n    contributionRefs:[...(Array.isArray(item?.contributionRefs)?item.contributionRefs:[])].map(normalize).filter(Boolean).sort(),\n    dependsOn:[...(Array.isArray(item?.dependsOn)?item.dependsOn:[])].map(normalize).filter(Boolean).sort(),",
          'signature contribution refs')

          replace_once(root,
          "export function validateDelegationPlan(delegations, { knownWorkIds = [], availableInputRefs = null } = {}) {",
          "export function validateDelegationPlan(delegations, { knownWorkIds = [], availableInputRefs = null, availableContributionRefs = null } = {}) {",
          'plan signature')

          replace_once(root,
          "      inputRefs:Array.isArray(item?.inputRefs) ? [...new Set(item.inputRefs.map(value => String(value).trim()).filter(Boolean))] : [],\n      __index:index,",
          "      inputRefs:Array.isArray(item?.inputRefs) ? [...new Set(item.inputRefs.map(value => String(value).trim()).filter(Boolean))] : [],\n      contributionRefs:Array.isArray(item?.contributionRefs) ? [...new Set(item.contributionRefs.map(value => String(value).trim()).filter(Boolean))] : [],\n      __index:index,",
          'plan normalized contribution refs')

          replace_once(root,
          "  const allowedInputs = Array.isArray(availableInputRefs) ? new Set(availableInputRefs.map(value=>String(value).trim()).filter(Boolean)) : null;\n  const ids = new Set();",
          "  const allowedInputs = Array.isArray(availableInputRefs) ? new Set(availableInputRefs.map(value=>String(value).trim()).filter(Boolean)) : null;\n  const contributionIssues=[];\n  const ids = new Set();",
          'plan contribution issues')

          replace_once(root,
          "    if (!item.stopCondition) issues.push(`工作 ${item.id || item.__index + 1} 缺少 stopCondition。`);\n    if (!['none','read','write'].includes(item.projectAccess))",
          "    if (!item.stopCondition) issues.push(`工作 ${item.id || item.__index + 1} 缺少 stopCondition。`);\n    const contribution=validateContributionRefs(item,availableContributionRefs);\n    item.contributionRefs=contribution.refs;\n    for(const reason of contribution.issues){const message=`工作 ${item.id || item.__index + 1}：${reason}`;issues.push(message);contributionIssues.push(message);}\n    if (!['none','read','write'].includes(item.projectAccess))",
          'plan contribution validation')

          replace_once(root,
          "    issues:[...new Set(issues)],\n    delegations:selected.map(({__index,...item}) => item),",
          "    issues:[...new Set(issues)],\n    contributionIssues:[...new Set(contributionIssues)],\n    delegations:selected.map(({__index,...item}) => item),",
          'plan return contribution issues')

          replace_once(root,
          "      const activeWork = session.currentStage ? session.currentStage.workUnits.map(unit => ({ id:unit.id, title:unit.title, status:unit.status, projectAccess:unit.projectAccess||'none', networkAccess:unit.networkAccess===true, dependsOn:unit.dependsOn })) : [];",
          "      const activeWork = session.currentStage ? session.currentStage.workUnits.map(unit => ({ id:unit.id, title:unit.title, status:unit.status, contributionRefs:[...(unit.contributionRefs||[])], projectAccess:unit.projectAccess||'none', networkAccess:unit.networkAccess===true, dependsOn:unit.dependsOn })) : [];",
          'active work contribution refs')

          replace_once(root,
          "        goal: String(d.goal || ''),\n        expectedOutput: String(d.expectedOutput || ''),",
          "        goal: String(d.goal || ''),\n        contributionRefs: Array.isArray(d.contributionRefs) ? [...d.contributionRefs] : [],\n        expectedOutput: String(d.expectedOutput || ''),",
          'stored work contribution refs')

          replace_once(root,
          "    const workUnit={ id:unit.id, title:unit.title, goal:unit.goal, expectedOutput:unit.expectedOutput, stopCondition:unit.stopCondition, projectAccess:unit.projectAccess||'none', networkAccess:unit.networkAccess===true, skillId:unit.skillId, dependsOn:[...(unit.dependsOn||[])], inputRefs:[...(unit.inputRefs||[])] };",
          "    const workUnit={ id:unit.id, title:unit.title, goal:unit.goal, contributionRefs:[...(unit.contributionRefs||[])], expectedOutput:unit.expectedOutput, stopCondition:unit.stopCondition, projectAccess:unit.projectAccess||'none', networkAccess:unit.networkAccess===true, skillId:unit.skillId, dependsOn:[...(unit.dependsOn||[])], inputRefs:[...(unit.inputRefs||[])] };",
          'executor work contribution refs')

          replace_once(root,
          "      if(this.hasUnfinishedWork(session)&&(decision.kind==='complete'||decision.kind==='human_gateway')){",
          "      if(this.hasUnfinishedWork(session)&&(decision.kind==='complete'||decision.kind==='human_gateway'||decision.kind==='wait')){",
          'wait unfinished work boundary')

          replace_once(root,
          "        const knownWorkIds=session.currentStage?.workUnits?.map(unit=>unit.id)||[];\n        const plan=validateDelegationPlan(decision.delegations,{knownWorkIds,availableInputRefs:taskInputRefs(task)});\n        const batchSignatures=new Set();",
          "        const knownWorkIds=session.currentStage?.workUnits?.map(unit=>unit.id)||[];\n        const availableContributionRefs=availableContributionRefsForTask(task,session.analysisState);\n        const plan=validateDelegationPlan(decision.delegations,{knownWorkIds,availableInputRefs:taskInputRefs(task),availableContributionRefs});\n        if(plan.contributionIssues?.length){\n          const reason=`ROOT_WORK_WITHOUT_GOVERNED_CONTRIBUTION: ${plan.contributionIssues.join(' | ')}`;\n          if(this.hasUnfinishedWork(session)){session.actor={title:'Root 推进边界',status:WorkUnitStatus.COMPLETED,detail:'新 Work 缺少明确 governed contribution；不启动它，继续等待已签发 Work。',updatedAt:nowIso(),owner:'root'};this.emit(session,callbacks);continue;}\n          const snapshot=this.makeSnapshot(session);this.discardSession(task.id);return{kind:'suspended',reason,snapshot,quiescent:true};\n        }\n        const batchSignatures=new Set();",
          'delegation contribution admission')

          replace_once(root,
          "        if(!plan.valid){session.planningRepairCount+=1;session.planningFeedback=plan.issues;session.planningTriggerRefs=[...rootTriggerRefs];session.actor={title:'Work Unit 契约校验',status:WorkUnitStatus.COMPLETED,detail:'Root 的新工作单不符合 Capability Contract；问题已作为内部规划反馈返回 Root。',updatedAt:nowIso(),owner:'root'};this.emit(session,callbacks);if(session.planningRepairCount>=MAX_TOTAL_ATTEMPTS){const error=new Error(`ROOT_INVALID_DELEGATION_PLAN: ${plan.issues.join(' | ')}`);error.nonRetryable=true;throw error;}continue;}\n        try{task=await this.certifyWorkAuthority(task,session,callbacks,plan.delegations);}",
          "        if(!plan.valid){session.planningRepairCount+=1;session.planningFeedback=plan.issues;session.planningTriggerRefs=[...rootTriggerRefs];session.actor={title:'Work Unit 契约校验',status:WorkUnitStatus.COMPLETED,detail:'Root 的新工作单不符合 Capability Contract；问题已作为内部规划反馈返回 Root。',updatedAt:nowIso(),owner:'root'};this.emit(session,callbacks);if(session.planningRepairCount>=MAX_TOTAL_ATTEMPTS){const error=new Error(`ROOT_INVALID_DELEGATION_PLAN: ${plan.issues.join(' | ')}`);error.nonRetryable=true;throw error;}continue;}\n        const repeatedContributions=repeatedContributionRefs(plan.delegations,rootInputs);\n        if(repeatedContributions.length&&!reviewed.turnNode&&!hasLocalProgressSignal(rootInputs)){\n          const reason=`ROOT_WORK_WITHOUT_STATE_ADVANCE: Work result did not change trusted state for ${repeatedContributions.join(', ')}; another Work against the same governed target is not admitted.`;\n          if(this.hasUnfinishedWork(session)){session.actor={title:'Root 推进边界',status:WorkUnitStatus.COMPLETED,detail:'当前结果没有形成新的可信状态；不追加同目标 Work，先等待已签发 Work 收敛。',updatedAt:nowIso(),owner:'root'};this.emit(session,callbacks);continue;}\n          const snapshot=this.makeSnapshot(session);this.discardSession(task.id);return{kind:'suspended',reason,snapshot,quiescent:true};\n        }\n        try{task=await this.certifyWorkAuthority(task,session,callbacks,plan.delegations);}",
          'same target no-delta boundary')

          replace_once(root,
          "      if(decision.kind==='human_gateway'){",
          "      if(decision.kind==='wait'){\n        const openGaps=session.analysisState?.current?.gaps||[];\n        const reason=openGaps.length?(decision.summary?.trim()||'当前 governed Gap 没有安全且有决策价值的机器推进路径；等待新的外部触发。'):'ROOT_WAIT_WITHOUT_GOVERNED_GAP: wait requires an explicit governed Gap so waiting cannot hide an undefined problem.';\n        const snapshot=this.makeSnapshot(session);this.discardSession(task.id);return{kind:'suspended',reason,snapshot,quiescent:true};\n      }\n\n      if(decision.kind==='human_gateway'){",
          'structured wait')

          replace_once(codex,
          "    kind:{type:'string',enum:['complete','human_gateway','delegate']},",
          "    kind:{type:'string',enum:['complete','human_gateway','delegate','wait']},",
          'codex wait schema')

          old="    delegations:{type:'array',items:{type:'object',properties:{id:{type:'string'},title:{type:'string'},goal:{type:'string'},expectedOutput:{type:'string'},stopCondition:{type:'string'},projectAccess:{type:'string',enum:['none','read','write']},networkAccess:{type:'boolean'},skillId:{type:['string','null']},dependsOn:{type:'array',items:{type:'string'}},inputRefs:{type:'array',items:{type:'string'},maxItems:40}},required:['id','title','goal','expectedOutput','stopCondition','projectAccess','networkAccess','skillId','dependsOn','inputRefs'],additionalProperties:false}},"
          new="    delegations:{type:'array',items:{type:'object',properties:{id:{type:'string'},title:{type:'string'},goal:{type:'string'},contributionRefs:{type:'array',items:{type:'string'},maxItems:12},expectedOutput:{type:'string'},stopCondition:{type:'string'},projectAccess:{type:'string',enum:['none','read','write']},networkAccess:{type:'boolean'},skillId:{type:['string','null']},dependsOn:{type:'array',items:{type:'string'}},inputRefs:{type:'array',items:{type:'string'},maxItems:40}},required:['id','title','goal','contributionRefs','expectedOutput','stopCondition','projectAccess','networkAccess','skillId','dependsOn','inputRefs'],additionalProperties:false}},"
          replace_once(codex,old,new,'codex contribution schema')

          replace_once(codex,
          "    const completedWork=(task.workReceipts||[]).map(receipt=>({id:receipt.id,title:receipt.workUnit?.title||receipt.id,goal:receipt.workUnit?.goal||'',inputRefs:receipt.workUnit?.inputRefs||[],projectAccess:receipt.workUnit?.projectAccess||'none',networkAccess:receipt.workUnit?.networkAccess===true,completedAt:receipt.completed_at||null}));",
          "    const completedWork=(task.workReceipts||[]).map(receipt=>({id:receipt.id,title:receipt.workUnit?.title||receipt.id,goal:receipt.workUnit?.goal||'',contributionRefs:receipt.workUnit?.contributionRefs||[],inputRefs:receipt.workUnit?.inputRefs||[],projectAccess:receipt.workUnit?.projectAccess||'none',networkAccess:receipt.workUnit?.networkAccess===true,completedAt:receipt.completed_at||null}));",
          'codex completed contribution refs')

          replace_once(codex,
          "    const skillCatalog=Array.isArray(policyContext?.skillCatalog)?policyContext.skillCatalog:[];\n    return `${policyPrompt(policyContext)}",
          "    const skillCatalog=Array.isArray(policyContext?.skillCatalog)?policyContext.skillCatalog:[];\n    const governedTargets=[\n      ...(task.taskContract?.obligations||[]).map(item=>({ref:`obligation:${item.id}`,kind:'obligation',criterion:item.criterion||null})),\n      ...(certifiedContext?.gaps||[]).map(item=>({ref:`gap:${item.id}`,kind:'gap',question:item.question,reason:item.reason,blocking:item.blocking===true})),\n    ];\n    return `${policyPrompt(policyContext)}",
          'codex governed targets')

          replace_once(codex,
          "- kind=delegate emits NEW bounded Work Units in delegations[] with goal, expectedOutput, stopCondition, projectAccess, networkAccess, dependsOn, inputRefs and optional skillId. projectAccess/networkAccess must be the minimum capabilities actually required by that Work Unit; Runtime may deny an unrealizable plan but must not silently weaken these semantics. inputRefs selects only the Task inputs needed by that Work Unit from the catalog below; use [] when no Task source is needed.\n- kind=human_gateway is only for one unresolved blocking Gap that truly requires human information/choice.",
          "- kind=delegate emits NEW bounded Work Units in delegations[] with goal, contributionRefs, expectedOutput, stopCondition, projectAccess, networkAccess, dependsOn, inputRefs and optional skillId. contributionRefs must name the governed need this Work advances using the exact refs below; use gap:<id> for an open Gap or obligation:<id> for an independent governed obligation. A new Work is not justified merely because its wording differs from earlier Work. projectAccess/networkAccess must be the minimum capabilities actually required by that Work Unit; Runtime may deny an unrealizable plan but must not silently weaken these semantics. inputRefs selects only the Task inputs needed by that Work Unit from the catalog below; use [] when no Task source is needed.\n- After a Work result is delivered, another Work against the same contributionRef requires this Turn to produce a state-bearing certified delta, or the prior Work to have returned a concrete local blocker. Mere uncertainty wording, a new method name, or more explanation is not progress.\n- kind=wait is the non-Human convergence result when governed Gaps remain open but no safe decision-relevant machine work is currently justified. Preserve the Gap and stop; do not invent Human ownership or another Work merely to stay active.\n- kind=human_gateway is only for one unresolved blocking Gap that truly requires human information/choice.",
          'codex progress protocol')

          replace_once(codex,
          "Available Skills:\\n${JSON.stringify(skillCatalog,null,2)}\n\nTask Input Catalog (use these refs in Work Unit inputRefs):",
          "Available Skills:\\n${JSON.stringify(skillCatalog,null,2)}\n\nGoverned Work Targets (use exact refs in Work Unit contributionRefs):\\n${JSON.stringify(governedTargets,null,2)}\n\nTask Input Catalog (use these refs in Work Unit inputRefs):",
          'codex governed target context')

          Path('.patch-complete').write_text('root progress patch applied\n',encoding='utf-8')
          PY
      - name: Commit product diff and remove patch harness
        shell: bash
        run: |
          git config user.name "TaskBoard Framework Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-root-progress-patch.yml
          git add src/core/root-runtime.js src/core/work-contribution.js src/extensions/executors/codex/codex-executor.js tests/root-goal-contribution.test.js .patch-complete
          git commit -m "fix: require state-bearing Root progress"
          git push origin HEAD:agent/root-goal-contribution-witness
