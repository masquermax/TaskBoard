name: Phase 4 Scheduler goal_satisfied wiring

on:
  push:
    branches: [agent/completion-single-owner-phase4]
    paths:
      - scripts/phase4-scheduler-goal-satisfied-wire.mjs
      - .github/workflows/phase4-scheduler-goal-satisfied-wire.yml

permissions:
  contents: write

jobs:
  wire-scheduler-goal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/completion-single-owner-phase4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/phase4-scheduler-goal-satisfied-wire.mjs
      - run: git diff --check
      - name: Verify Scheduler lifecycle projection and Completion boundaries
        run: node --test tests/completion-scheduler-phase4.test.js tests/completion-runtime-phase4.test.js tests/completion-single-owner-boundary-phase4.test.js
      - name: Commit verified Scheduler projection
        run: |
          git config user.name "taskboard-phase4-bot"
          git config user.email "taskboard-phase4-bot@users.noreply.github.com"
          git add src/core/scheduler.js
          git diff --cached --quiet && exit 0
          git commit -m "refactor: project goal_satisfied into Task lifecycle"
          git push origin HEAD:agent/completion-single-owner-phase4
