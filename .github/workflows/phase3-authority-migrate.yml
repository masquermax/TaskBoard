name: Phase 3 authority migration

on:
  push:
    branches: [agent/authority-single-owner-phase3]
    paths:
      - scripts/phase3-authority-migrate.mjs
      - scripts/phase3-*.patch
      - .github/workflows/phase3-authority-migrate.yml
      - tests/**
      - src/governance/task-contract-fidelity.js
      - src/governance/governance-compiler.js
      - src/governance/role-capability-contract.js

permissions:
  contents: write

jobs:
  migrate-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authority-single-owner-phase3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/phase3-authority-migrate.mjs
      - name: Apply transparent Phase 3 regression migrations
        run: |
          for patch in scripts/phase3-*.patch; do
            echo "Applying $patch"
            git apply --recount "$patch"
          done
      - run: git diff --check
      - run: npm run verify
      - name: Commit verified Phase 3 source and regression changes
        run: |
          git config user.name "taskboard-phase3-bot"
          git config user.email "taskboard-phase3-bot@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: complete single-owner authority runtime path"
          git push origin HEAD:agent/authority-single-owner-phase3
