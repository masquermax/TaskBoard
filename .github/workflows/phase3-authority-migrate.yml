name: Phase 3 authority migration
on:
  push:
    branches: [agent/authority-single-owner-phase3]
    paths: [scripts/phase3-authority-migrate.mjs, .github/workflows/phase3-authority-migrate.yml]
permissions:
  contents: write
jobs:
  migrate-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authority-single-owner-phase3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/phase3-authority-migrate.mjs
      - run: git diff --check
      - run: npm run verify
      - name: Commit verified Phase 3 product changes
        run: |
          git config user.name "taskboard-phase3-bot"
          git config user.email "taskboard-phase3-bot@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: complete single-owner authority runtime path"
          git push origin HEAD:agent/authority-single-owner-phase3
