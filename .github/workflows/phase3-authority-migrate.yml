name: Phase 3 authority final hygiene

on:
  push:
    branches: [agent/authority-single-owner-phase3]
    paths:
      - scripts/phase3-final-*.patch
      - .github/workflows/phase3-authority-migrate.yml

permissions:
  contents: write

jobs:
  verify-final-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authority-single-owner-phase3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final Authority hygiene
        run: |
          git apply scripts/phase3-final-executor.patch
          git apply scripts/phase3-final-role-guide.patch
      - run: git diff --check
      - run: npm run verify
      - name: Commit verified product and documentation hygiene
        run: |
          git config user.name "taskboard-phase3-bot"
          git config user.email "taskboard-phase3-bot@users.noreply.github.com"
          git add src docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: close remaining authority source ambiguity"
          git push origin HEAD:agent/authority-single-owner-phase3
