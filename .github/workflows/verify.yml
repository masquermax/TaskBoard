name: Verify

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify
        run: npm run verify

  fresh-unpack:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build tracked-files archive
        run: git archive --format=tar --output=/tmp/taskboard.tar HEAD
      - name: Verify fresh unpack
        shell: bash
        run: |
          rm -rf /tmp/taskboard-unpack
          mkdir -p /tmp/taskboard-unpack
          tar -xf /tmp/taskboard.tar -C /tmp/taskboard-unpack
          cd /tmp/taskboard-unpack
          npm run verify
