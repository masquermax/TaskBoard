name: Verify

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-host-only:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'v0.9.2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply migration
        shell: bash
        run: |
          node scripts/migrate-host-only.mjs
          git restore --source=HEAD -- .github/workflows/verify.yml .github/workflows/migrate-extension-boundary.yml
      - name: Verify migrated Host
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run verify
      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "masquermax"
          git config user.email "224842982+masquermax@users.noreply.github.com"
          mapfile -t changed < <(git diff --name-only)
          if ((${#changed[@]})); then git add -- "${changed[@]}"; fi
          git add -- tests/helpers/test-executor.js tests/helpers/test-extension-registry.js tests/extension-repository-boundary.test.js
          git status --short
          git commit -m "refactor: keep concrete extensions outside TaskBoard"
          git push origin HEAD:v0.9.2

  verify-current:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'v0.9.2' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run verify
