name: Verify

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary-inventory:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory concrete-extension references
        shell: bash
        run: |
          echo '=== concrete extension source/test references ==='
          grep -RInE "createBuiltinExtensionRegistry|src/extensions/(builtins|capabilities|config|executors|surfaces)|windows-codex|windows-surface|CODEX_|OpenAI\\.Codex|provider-acceptance" tests src scripts docs package.json README.md || true

  connection-acceptance:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify AI connection acceptance
        run: npm run verify:connection

  verify:
    needs: connection-acceptance
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify
        run: npm run verify

  fresh-unpack:
    needs: verify
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build tracked-files archive
        run: git archive --format=tar --output=/tmp/taskboard.tar HEAD
      - name: Verify fresh unpack
        shell: bash
        run: |
          rm -rf /tmp/taskboard-unpack
          mkdir -p /tmp/taskboard-unpack
          tar -xf /tmp/taskboard.tar -C /tmp/taskboard-unpack
          cd /tmp/taskboard-unpack
          npm run verify
