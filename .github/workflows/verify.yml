name: Verify

on:
  push:
  pull_request:
    branches:
      - main
      - v0.9.2
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layered:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        layer: [module, functional]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run ${{ matrix.layer }} tests
        run: npm run test:${{ matrix.layer }}

  coverage:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Measure full-suite coverage
        run: npm run test:coverage

  verify:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify
        run: npm run verify

  fresh-unpack:
    needs:
      - layered
      - coverage
      - verify
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build tracked-files archive
        run: git archive --format=tar --output=/tmp/taskboard.tar HEAD
      - name: Verify fresh unpack
        shell: bash
        run: |
          rm -rf /tmp/taskboard-unpack
          mkdir -p /tmp/taskboard-unpack
          tar -xf /tmp/taskboard.tar -C /tmp/taskboard-unpack
          cd /tmp/taskboard-unpack
          npm run verify
