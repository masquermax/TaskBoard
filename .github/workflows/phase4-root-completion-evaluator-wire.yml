name: Phase 4 Root CompletionEvaluator wiring

on:
  push:
    branches: [agent/completion-single-owner-phase4]
    paths:
      - scripts/phase4-root-completion-evaluator-wire.mjs
      - .github/workflows/phase4-root-completion-evaluator-wire.yml

permissions:
  contents: write

jobs:
  wire-root-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/completion-single-owner-phase4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/phase4-root-completion-evaluator-wire.mjs
      - run: git diff --check
      - name: Verify Phase 4 Completion focused contracts
        run: node --test tests/completion-evaluator-phase4.test.js tests/completion-assessment-verifier-phase4.test.js tests/completion-runtime-phase4.test.js tests/completion-single-owner-boundary-phase4.test.js
      - name: Commit verified RootRuntime completion wiring
        run: |
          git config user.name "taskboard-phase4-bot"
          git config user.email "taskboard-phase4-bot@users.noreply.github.com"
          git add src/core/root-runtime.js
          git diff --cached --quiet && exit 0
          git commit -m "refactor: route Root completion through CompletionEvaluator"
          git push origin HEAD:agent/completion-single-owner-phase4
