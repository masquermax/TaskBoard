name: Phase 4 Repository completion owner cut

on:
  push:
    branches: [agent/completion-single-owner-phase4]
    paths:
      - scripts/phase4-repository-completion-cut.mjs
      - .github/workflows/phase4-repository-completion-cut.yml

permissions:
  contents: write

jobs:
  cut-repository-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/completion-single-owner-phase4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/phase4-repository-completion-cut.mjs
      - run: git diff --check
      - name: Verify CompletionEvaluator semantics
        run: node --test tests/completion-evaluator-phase4.test.js
      - name: Verify Root completion boundary remains closed
        run: node --test --test-name-pattern="Root complete is only a proposal" tests/completion-single-owner-boundary-phase4.test.js
      - name: Verify Scheduler completion boundary remains closed
        run: node --test --test-name-pattern="Scheduler cannot translate runtime complete" tests/completion-single-owner-boundary-phase4.test.js
      - name: Verify Repository never infers SUCCESS
        run: node --test --test-name-pattern="Repository never infers SUCCESS" tests/completion-single-owner-boundary-phase4.test.js
      - name: Commit verified Repository owner cut
        run: |
          git config user.name "taskboard-phase4-bot"
          git config user.email "taskboard-phase4-bot@users.noreply.github.com"
          git add src/core/json-repository.js
          git diff --cached --quiet && exit 0
          git commit -m "refactor: remove Repository SUCCESS inference"
          git push origin HEAD:agent/completion-single-owner-phase4
