carrier_classes:
  TASKBOARD_PATROL:
    task_ids: [TASKBOARD-PROMOTION-001]
    rule: "Only active/reopened promotion candidates with current decision-changing evidence are executable. Parked/adopted/superseded candidates are not scheduler work."

migration:
  central_runtime: ACTIVE_ROUTE
  legacy_scheduler_coordination: RETIRED
  rule: "TaskBoard is a Runtime client, never the shared coordination owner."

runtime_guard:
  - "Execution authority comes only from the current per-Task runtime file: matching claim_id, worker/run, task_revision and an unexpired WORKING/COMMITTING lease."
  - "Claim/takeover/renew/release use the runtime file blob SHA as CAS. A stale SHA/409 loses the race and must reread; never hand-edit legacy BOARD.json or create Runtime requests."
  - "Expired WORKING may be taken over by CAS. COMMITTING may never be taken over directly; reconcile the recorded Owner intent first."
  - "Before any durable Owner mutation, reread Task spec + runtime and transition the matching claim to COMMITTING. Git Owner writes use a prebuilt target commit and non-force branch ref update; never force-push."
  - "If useful research outlives authority, preserve it under the configured candidate_prefix with task_revision, owner_base, proposal and evidence; do not write Owner directly."
  - "All GitHub mutations use write-readback verification: retry the same logical write only when verified NOT_APPLIED, at most 3 total attempts; AMBIGUOUS/UNKNOWN is fail-closed and must be reconciled."
