carrier_classes:
  TASKBOARD_PATROL:
    task_ids: [TASKBOARD-PROMOTION-001]
    rule: "Only active/reopened promotion candidates with current decision-changing evidence are executable. Parked/adopted/superseded candidates are not scheduler work."

migration:
  central_runtime: ACTIVE_ROUTE
  legacy_scheduler_coordination: RETIRED
  rule: "TaskBoard is a Runtime client, never the shared coordination owner."

runtime_guard:
  - "Scheduled carriers are read-only against target-repository substantive/durable state until an APPLIED current Runtime Task/WU claim matches this worker/run."
  - "A no-action candidate is skipped locally; the generic Worker continues scanning other currently eligible candidates and exits only after the current candidate set is exhausted/claimed elsewhere or a real execution boundary is reached."
  - "Before a normal Worker return, any clean held claim must be checkpointed when needed and released. IN_FLIGHT/UNKNOWN Owner/external reality must be reconciled/fail-closed, never silently abandoned."
  - "Canonical/durable Owner mutation must use the current Runtime PREPARE -> IN_FLIGHT -> Owner mutation -> ACK/reconcile path."
  - "Scheduled CLAIM/CLAIM_TASK uses request_expires_at at approximately args.now+120s; do not invent shorter 40/45/90-second windows. Initial lease remains <= about 120s and is rebased by Runtime at handling time."
  - "Long research may outlive a claim. If useful research returns without a current matching claim, preserve it with SUBMIT_TASK_CANDIDATE; do not write substantive/durable Owner state directly."
  - "Immediately before any target-repository create/update/delete, reread the central Board. Canonical Owner mutation requires this worker/run to hold the current claim and the matching pending commit to be IN_FLIGHT; otherwise the target repository is read-only."
